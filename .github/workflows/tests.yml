name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - name: Tests (Linux, under Xvfb)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          xvfb-run -a python -m unittest discover -s tests -t . -v
      - name: Tests
        if: runner.os != 'Linux'
        run: python -m unittest discover -s tests -t . -v

  build-exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt "pyinstaller>=6.9"
      - run: python -m PyInstaller --clean --noconfirm TRON-GRAVE.spec
      - uses: actions/upload-artifact@v4
        with:
          name: TRON-GRAVE-exe
          path: dist/TRON-GRAVE.exe
